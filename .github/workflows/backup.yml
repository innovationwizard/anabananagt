# ============================================================================
# Respaldo semanal de producción — base de datos (pg_dump) + medios (bucket).
#
# Supabase Pro respalda la base a diario (7 días), pero Storage NO tiene
# versionado (los borrados son permanentes): este respaldo cubre ambos como
# segunda copia, guardada como artefacto del repositorio (90 días).
#
# Secretos requeridos (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL   — conexión directa/session (5432), NO el pooler 6543
#   S3_ENDPOINT       — https://<ref>.storage.supabase.co/storage/v1/s3
#   S3_BUCKET         — nombre del bucket de medios
#   S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY — claves S3 de Supabase Storage
#
# También ejecutable a mano: Actions → Respaldo de producción → Run workflow.
# Restauración: ver docs/DESPLIEGUE.md.
# ============================================================================

name: Respaldo de producción

on:
  schedule:
    # Domingos 08:00 UTC (02:00 Guatemala)
    - cron: "0 8 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: pg_dump (postgres 17)
        run: |
          docker run --rm \
            -e DB_URL='${{ secrets.SUPABASE_DB_URL }}' \
            -v "$PWD:/backup" \
            postgres:17 \
            sh -c 'pg_dump "$DB_URL" --no-owner --no-privileges -F c -f /backup/db.dump'
          ls -lh db.dump

      - name: Sincronizar bucket de medios
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws s3 sync "s3://${{ secrets.S3_BUCKET }}" ./media-backup \
            --endpoint-url "${{ secrets.S3_ENDPOINT }}"
          tar -czf media.tar.gz media-backup
          ls -lh media.tar.gz

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-${{ github.run_id }}
          retention-days: 90
          path: |
            db.dump
            media.tar.gz
